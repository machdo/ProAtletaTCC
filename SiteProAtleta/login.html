<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Atleta</title>
    <link rel="stylesheet" href="loginstyle.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script>
        function validarSenha(event) {
            const senha = document.getElementById('senha').value;
            const confirmarSenha = document.getElementById('confirmar_senha').value;
            const erroSpan = document.getElementById('erro-senha');

            if (senha !== confirmarSenha) {
                erroSpan.textContent = 'As senhas não coincidem.';
                event.preventDefault();
            } else {
                erroSpan.textContent = '';
            }
        }

        function mostrarMensagemSucesso() {
            const params = new URLSearchParams(window.location.search);
            if (params.get("cadastro") === "ok") {
                alert("Cadastro realizado com sucesso!");
                window.location.href = "index.html";
            }
        }

        window.onload = mostrarMensagemSucesso;
    </script>
</head>

<body>
    <div class="form-container">
        <header class="header">
            <div class="interface">
                <div class="logo">
                    <a href="index.html">
                        <img src="images/logo.png" alt="Logo branca" class="logo-branca" width="200px" height="75px">
                    </a>
                </div>
            </div>
        </header>
        <section class="formulario" id="contato">
            <div class="interface">
                <h2 class="titulo">Cadastro</h2>

                <form action="cadastro_atleta.php" method="POST" onsubmit="validarSenha(event)">
                    <div class="input-group">
                        <i class="fas fa-user"></i>
                        <input type="text" placeholder="Seu nome:" required name="nome">
                    </div>

                    <div class="input-group">
                        <i class="fas fa-at"></i>
                        <input type="email" placeholder="Ex: nome@gmail.com" required name="email">
                    </div>

                    <div class="input-group">
                        <i class="fas fa-lock"></i>
                        <input type="password" placeholder="Sua senha:" required name="senha" id="senha">
                    </div>

                    <div class="input-group">
                        <i class="fas fa-lock"></i>
                        <input type="password" placeholder="Confirme sua senha:" required id="confirmar_senha">
                    </div>
                    <span id="erro-senha" style="color:red; text-align:center; display:block;"></span>

                    <button type="submit"> <a href="index.html"></a><span>Cadastrar</span></button>
                </form>
            </div>
        </section>
    </div>
</body>

</html>
