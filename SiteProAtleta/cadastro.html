<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Atleta</title>
    <link rel="stylesheet" href="cadastro.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>

<body>
    <div class="form-container">
        <header class="header">
            <div class="interface">
                <div class="logo">
                    <a href="index.html">
                        <img src="images/logo.png" alt="Logo branca" class="logo-branca" width="200px" height="75px">
                    </a>
                </div>
            </div>
        </header>
        <section class="formulario" id="contato">
            <div class="interface">
                <h2 class="titulo">Cadastro</h2>

                <form id="cadastroForm" action="https://mediumslateblue-ibex-354235.hostingersite.com/cadastro_site.php" method="POST">
                    <div class="input-group">
                        <i class="fas fa-user"></i>
                        <input type="text" placeholder="Seu nome" required name="nome" id="nome">
                    </div>

                    <div class="input-group">
                        <i class="fas fa-at"></i>
                        <input type="email" placeholder="Ex: nome@gmail.com" required name="email" id="email">
                    </div>

                    <div class="input-group">
                        <i class="fas fa-lock"></i>
                        <input type="password" placeholder="Sua senha" required name="senha" id="senha">
                        <i id="viewPassword" class="fas fa-eye olho"></i>
                    </div>

                   
                    <p id="mensagem" style="color: red;"></p>

                    <button type="submit"><span>Cadastrar</span></button>
                </form>
            </div>
        </section>
    </div>

    <script src="cadastro_site.js"></script>
    <script src="mascara_cadastro.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

</body>

</html>
