<!DOCTYPE html>
<html>

<head>
    <!-- Required meta tags-->
    <meta charset="utf-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <!-- Color theme for statusbar (Android only) -->
    <meta name="theme-color" content="#2196f3">
    <!-- Your app title -->
    <title>Perfil</title>
    <!-- Path to Framework7 Library Bundle CSS -->
    <link rel="stylesheet" href="lib/framework7-bundle.min.css">
    <!-- CSS PERSONALIZADO PARA MENU-->
    <link rel="stylesheet" href="css/perfil.css">
    <!--Ícones Material Design-->
    <link rel="stylesheet" href="css/materialdesignicons.min.css">


</head>

<body>
    <!-- App root element -->
    <div id="app">

        <!-- Your main view, should have "view-main" class -->
        <div class="view view-main">
            <!-- Initial Page, "data-name" contains page name -->
            <div data-name="perfil_prof" class="page">

                <!-- Top Navbar -->
                <div class="top-nav2">
                    <h1 class="title-logo2">Perfil</h1>
                </div>

                <!-- Scrollable page content -->
                <div class="page-content">
                    <div class="block">

                        <div class="foto-container">
                            <img id="fotoProf" src="img/user.jpg" alt="Foto de Perfil" class="foto-perfil">

                            <input type="file" id="fotoInput2" name="foto2" accept="image/*" required
                                class="input-arquivo" />

                            <label for="fotoInput2" class="botao-upload"><i class="mdi mdi-pencil"></i></label>
                        </div>

                        <form id="uploadFotoprofForm" enctype="multipart/form-data">
                            <button type="submit">Trocar Foto</button>
                        </form>

                        <h2>Olá, <span id="nomeProf"></span></h2>
                        <p>Email: <span id="emailProf"></span></p>
                    </div>

                    <div class="divisoria"></div><br>

                    <div class="block">
                        <h3>Buscar Aluno</h3>
                        <form id="buscarAlunoForm" action="https://proatleta.site/solicitacao.php" method="POST">
                            <div class="list no-hairlines-md">
                                <ul>
                                    <li class="item-content item-input">
                                        <div class="item-inner">
                                            <div class="item-input-wrap">
                                                <input type="email" id="busca_email" name="busca_email"
                                                    placeholder="Digite o email do aluno" required>
                                            </div>
                                        </div>
                                    </li>
                                </ul>
                            </div>
                            <button type="submit" class="button button-fill">Procurar</button>
                        </form>
                        <div id="resultadoBusca"></div>
                    </div>

                </div>

            </div>
        </div>
    </div>

    <script type="text/javascript" src="lib/framework7-bundle.min.js"></script>
    <script type="text/javascript" src="lib/jquery-3.7.0.min.js"></script>
    <script type="text/javascript" src="js/routes.js"></script>
    <script src="js/foto_prof.js"></script>
    <script src="js/solicitacao.js"></script>
    <script src="cordova.js"></script>
</body>

</html>
