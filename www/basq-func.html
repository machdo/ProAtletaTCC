<!DOCTYPE html>
<html>

<head>
    <!-- Required meta tags-->
    <meta charset="utf-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <!-- Color theme for statusbar (Android only) -->
    <meta name="theme-color" content="#2196f3">
    <!-- Your app title -->
    <title>Treino</title>
    <!-- Path to Framework7 Library Bundle CSS -->
    <link rel="stylesheet" href="lib/framework7-bundle.min.css">
    <!-- CSS PERSONALIZADO PARA MENU-->
    <link rel="stylesheet" href="css/index.css">
    <!--Ícones Material Design-->
    <link rel="stylesheet" href="css/materialdesignicons.min.css">
    <!-- Ícones Remix Icons -->
    <link rel="stylesheet" href="css/remixicon/remixicon.css">

</head>

<body>
    <!-- App root element -->
    <div id="app">

        <!-- Your main view, should have "view-main" class -->
        <div class="view view-main">
            <!-- Initial Page, "data-name" contains page name -->
            <div data-name="Treino" class="page">

                <!-- Top Navbar -->
                <div class="top-nav2">
                    <div class="navbar-btn2">
                        <a href="/treino-basq/" class="btn-voltar">
                            <i class="ri-arrow-left-s-line"></i>
                        </a>
                    </div>
                    <h1 class="title-logo2">Basquete</h1>
                </div>

                <!-- Scrollable page content -->
                <div class="page-content">
                    <div class="block training-block">

                        <!-- Treinamento Funcional Card -->
                        <div class="training-card" data-training="funcional">
                            <a href="/agachamento/">
                                <div class="card-header">
                                    <div class="card-info">
                                        <h3 class="card-title">Agachamento Livre</h3>
                                        <p class="card-category">Funcional - Pernas</p>
                                    </div>
                                    <div class="play-button" data-training="funcional">
                                        <i class="ri-play-fill"></i>
                                    </div>
                                </div>

                                <div class="training-details">
                                    <div class="detail-item">
                                        <div class="detail-icon">
                                            <i class="ri-refresh-line"></i>
                                        </div>
                                        <div class="detail-info">
                                            <span class="detail-label">Séries</span>
                                            <span class="detail-value">3x</span>
                                        </div>
                                    </div>

                                    <div class="detail-item">
                                        <div class="detail-icon">
                                            <i class="ri-repeat-line"></i>
                                        </div>
                                        <div class="detail-info">
                                            <span class="detail-label">Reps</span>
                                            <span class="detail-value">15</span>
                                        </div>
                                    </div>

                                    <div class="detail-item">
                                        <div class="detail-icon">
                                            <i class="ri-scales-3-line"></i>
                                        </div>
                                        <div class="detail-info">
                                            <span class="detail-label">Carga</span>
                                            <span class="detail-value">60kg</span>
                                        </div>
                                    </div>
                                </div>
                            </a>
                        </div>

                        <!-- Fundamentos Card -->
                        <div class="training-card" data-training="fundamentos">
                            <a href="/basq-fund/">
                                <div class="card-header">
                                    <div class="card-icon fundamentals-icon">
                                        <i class="mdi mdi-book-open-variant"></i>
                                    </div>
                                    <div class="card-info">
                                        <h3 class="card-title">Fundamentos</h3>
                                        <div class="progress-container">
                                            <div class="progress-bar">
                                                <div class="progress-fill fundamentals-progress" data-progress="35">
                                                </div>
                                            </div>
                                            <span class="progress-text">35%</span>
                                        </div>
                                    </div>
                                    <div class="play-button" data-training="fundamentos">
                                        <i class="ri-play-fill"></i>
                                    </div>
                                </div>
                            </a>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </div>
    </div>
    <!-- Path to Framework7 Library Bundle JS-->
    <script type="text/javascript" src="lib/framework7-bundle.min.js"></script>
    <!-- jQuery -->
    <script type="text/javascript" src="lib/jquery-3.7.0.min.js"></script>
    <!-- Roteamento do app-->
    <script type="text/javascript" src="js/routes.js"></script>
    <script src="cordova.js"></script>
</body>

</html>
