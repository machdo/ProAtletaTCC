<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#2196f3">
    <title>Agenda</title>
    <link rel="stylesheet" href="lib/framework7-bundle.min.css">
    <link rel="stylesheet" href="css/agenda_prof.css">
    <link rel="stylesheet" href="css/materialdesignicons.min.css">
    <link rel="stylesheet" href="css/remixicon/remixicon.css">
</head>

<body>
    <div id="app">
        <div class="view view-main">
            <div data-name="adicionar-evento" class="page">
                <!-- Top Navbar -->
                <div class="top-nav">
                    <div class="logo-titulo">
                        <img src="img/logo_letrero.png">
                    </div>
                    <div class="navbar-btn">
                        <a href="/config/" class="btn-config link">
                            <i class="ri-settings-5-fill"></i>
                        </a>
                        <a href="#" class="btn-noti" datacount="1">
                            <i class="mdi mdi-bell"></i>
                        </a>
                    </div>
                </div>
                <div class="page-content">
                    <form id="formAdicionarEvento">
                        <div class="list">
                            <ul>
                                <li>
                                    <div class="item-title">Título</div>
                                    <div class="item-input-row">
                                        <input type="text" name="titulo" placeholder="Título do evento" required>
                                    </div>
                                </li>
                                <li>
                                    <div class="item-title">Data</div>
                                    <div class="item-input-row">
                                        <input type="date" name="data" id="inputData" required>
                                    </div>
                                </li>
                                <li>
                                    <div class="item-title">Hora</div>
                                    <div class="item-input-row">
                                        <input type="time" name="hora" id="inputHora" required>
                                    </div>
                                </li>
                            </ul>
                        </div>
                        <div class="block">
                            <button type="submit" class="button-fill">Adicionar Evento</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <script src="lib/framework7-bundle.min.js"></script>
    <script src="lib/jquery-3.7.0.min.js"></script>
    <script src="js/agenda_prof.js"></script>
    <script>
        function focusInput(id) {
            const input = document.getElementById(id);
            if (input) {
                input.focus();
                if (input.showPicker) input.showPicker();
            }
        }
    </script>
</body>

</html>
