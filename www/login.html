<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#2196f3">
  <title>Login</title>
  <link rel="stylesheet" href="lib/framework7-bundle.min.css">
  <link rel="stylesheet" href="css/personalizado.css">
</head>

<body>
  <div id="app">
    <div class="view view-main">
      <div data-name="login" class="page">
        <div class="top-nav2">
          <h1 class="title-logo2">Login</h1>
        </div>
        <div class="page-content">
          <div class="block">
            <form id="loginForm" action="https://mediumslateblue-ibex-354235.hostingersite.com/login.php" method="POST">
              <div class="list no-hairlines-md">
                <ul>
                  <li class="item-content item-input">
                    <div class="item-inner">
                      <div class="item-title item-label">Email</div>
                      <div class="item-input-wrap">
                        <input type="email" id="email" name="email" required placeholder="Digite seu email" />
                      </div>
                    </div>
                  </li>
                  <li class="item-content item-input">
                    <div class="item-inner">
                      <div class="item-title item-label">Senha</div>
                      <div class="item-input-wrap">
                        <input type="password" id="senha" name="senha" required placeholder="Digite sua senha" />
                      </div>
                    </div>
                  </li>
                </ul>
              </div>
              <div class="block">
                <button type="submit" class="button button-fill color-blue">Entrar</button>
              </div>

              <div class="block text-align-center">
                <a href="*" class="link" onclick="window.location.href='cadastro.html'">Fazer cadastro</a>
              </div>
            </form>
            <div id="mensagemLogin" class="block text-align-center color-red"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="lib/framework7-bundle.min.js"></script>
  <script src="lib/jquery-3.7.0.min.js"></script>
  <script src="cordova.js"></script>
  <script src="js/login.js"></script>
  <script src="js/mascaras.js"></script>
</body>

</html>
