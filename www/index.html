<!DOCTYPE html>
<html>

<head>
    <!-- Required meta tags-->
    <meta charset="utf-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <!-- Color theme for statusbar (Android only) -->
    <meta name="theme-color" content="#2196f3">
    <!-- Your app title -->
    <title>Ínicio</title>
    <!-- Path to Framework7 Library Bundle CSS -->
    <link rel="stylesheet" href="lib/framework7-bundle.min.css">
    <!-- CSS PERSONALIZADO PARA MENU-->
    <link rel="stylesheet" href="css/index.css">
    <!--Ícones Material Design-->
    <link rel="stylesheet" href="css/materialdesignicons.min.css">
    <!-- Ícones Remix Icons -->
    <link rel="stylesheet" href="css/remixicon/remixicon.css">


</head>

<body>
    <!-- App root element -->
    <div id="app">

        <!-- Your main view, should have "view-main" class -->
        <div class="view view-main">

            <!-- TAB BAR-->
            <div class="toolbar toolbar-bottom">
                <div class="toolbar-inner display-flex">
                    <a href="/index/" class="tab-link link active">
                        <i class="ri-home-2-fill"></i>
                        <span>Ínicio</span>
                    </a>
                    <a href="/link2/" class="tab-link link">
                        <i class="ri-add-large-fill"></i>
                        <span>ProAtleta+</span>
                    </a>
                    <a href="/link3/" class="tab-link link">
                        <i class="mdi mdi-dumbbell"></i>
                        <span>Treino</span>
                    </a>
                    <a href="/link4/" class="tab-link link">
                        <i class="ri-calendar-fill"></i>
                        <span>Agenda</span>
                    </a>
                    <a href="/link5/" class="tab-link link">
                        <i class="ri-user-fill"></i>
                        <span>Perfil</span>
                    </a>

                </div>
            </div>

            <!-- Initial Page, "data-name" contains page name -->
            <div data-name="index" class="page color-theme-blue">

                <!-- Top Navbar -->
                <div class="top-nav">
                    <div class="logo-titulo">
                        <img src="../www/img/logo.png">
                        <h1 class="title-logo">ProAtleta</h1>
                    </div>
                    <div class="navbar-btn">
                        <a href="#" class="btn-config">
                            <i class="ri-settings-5-fill"></i>
                        </a>
                        <a href="#" class="btn-noti" datacount="1">
                            <i class="mdi mdi-bell"></i>
                        </a>
                    </div>
                </div>

                <!-- Scrollable page content -->
                <div class="page-content">
                    <div class="block">
                        <div class="swiper mySwiper">
                            <div class="swiper-wrapper">
                                <div class="swiper-slide">
                                    <a href="/link2/" class="link">
                                    <img src="img/propaganda1.png">
                                    </a>
                                </div>
                                <div class="swiper-slide">
                                    <img src="img/propaganda_2.png">
                                </div>
                                <div class="swiper-slide">
                                    <img src="img/propaganda3.png">
                                </div>
                                <div class="swiper-slide">
                                    <img src="img/propaganda4.png">
                                </div>
                            </div>
                            <div class="swiper-pagination"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- Path to Framework7 Library Bundle JS-->
    <script type="text/javascript" src="lib/framework7-bundle.min.js"></script>
    <!-- jQuery -->
    <script type="text/javascript" src="lib/jquery-3.7.0.min.js"></script>
    <!-- Roteamento do app-->
    <script type="text/javascript" src="js/routes.js"></script>
    <script src="cordova.js"></script>
</body>

</html>
