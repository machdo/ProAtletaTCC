<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#2196f3">
    <title>Treinos do Aluno</title>
    <link rel="stylesheet" href="lib/framework7-bundle.min.css">
    <link rel="stylesheet" href="css/materialdesignicons.min.css">
    <link rel="stylesheet" href="css/remixicon/remixicon.css">
    <link id="ver-treinos-aluno-css" rel="stylesheet" href="css/ver_treinos_aluno.css">
</head>

<body>
    <div id="app">
        <div class="view view-main">
            <div data-name="ver_treinos_aluno" class="page">

                <!-- Top Navbar -->
                <div class="top-nav2">
                    <div class="navbar-btn">
                        <a href="/treinos_prof/" class="btn-voltar">
                            <i class="ri-arrow-left-s-line"></i>
                        </a>
                    </div>
                    <h1 class="title-logo2">Treinos</h1>
                </div>

                <!-- Conteúdo da página -->
                <div class="page-content" style="padding-top: 0;">
                    
                    <!-- Header do Aluno -->
                    <div class="aluno-header">
                        <h2 id="nomeAlunoHeader">Carregando...</h2>
                        <p id="emailAlunoHeader" style="display: none;">...</p>
                    </div>
                    
                    <!-- Lista de Treinos -->
                    <div class="block">
                        <div id="listaTreinos">
                            <!-- Treinos serão carregados aqui -->
                            <div class="empty-state">
                                <i class="mdi mdi-loading mdi-spin"></i>
                                <p>Carregando treinos...</p>
                            </div>
                        </div>
                    </div>
                    
                </div>
            </div>
        </div>
    </div>

    <script type="text/javascript" src="lib/framework7-bundle.min.js"></script>
    <script type="text/javascript" src="lib/jquery-3.7.0.min.js"></script>
    <script type="text/javascript" src="js/routes.js"></script>
    <script type="text/javascript" src="js/ver_treinos_aluno.js"></script>
    <script src="cordova.js"></script>

</body>
</html>
