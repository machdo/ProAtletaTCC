<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#2196f3">
    <title>Cadastro</title>
    <link rel="stylesheet" href="lib/framework7-bundle.min.css">
    <link rel="stylesheet" href="css/materialdesignicons.min.css">
    <link rel="stylesheet" href="css/cadastro.css">
    <link rel="stylesheet" href="css/remixicon/remixicon.css">
</head>

<body>
    <div id="app">
        <div class="view view-main">
            <div data-name="cadastro" class="page">

                <!-- Top Navbar -->
                <div class="top-nav2">
                    <h1 class="title-logo2">Cadastro</h1>
                    <div class="navbar-btn">
                        <a href="*" class="btn-voltar" onclick="window.location.href='index.html'">
                            <i class="ri-arrow-left-s-line"></i>
                        </a>
                    </div>
                </div>

                <!-- Página com formulário -->
                <div class="page-content">
                    <div class="block">
                        <form id="cadastroForm" data-name="cadastro"
                            action="https://mediumslateblue-ibex-354235.hostingersite.com/cadastro.php" method="POST">
                            <div class="list no-hairlines-md">
                                <ul>
                                    <li class="item-content item-input">
                                        <div class="item-inner">
                                            <div class="item-title item-label">Nome</div>
                                            <div class="item-input-wrap">
                                                <input type="text" id="nome" name="nome" placeholder="Digite seu nome"
                                                    required>
                                            </div>
                                        </div>
                                    </li>
                                    <li class="item-content item-input">
                                        <div class="item-inner">
                                            <div class="item-title item-label">Email</div>
                                            <div class="item-input-wrap">
                                                <input type="email" id="email" name="email"
                                                    placeholder="Digite seu email" required>
                                            </div>
                                        </div>
                                    </li>
                                    <li class="item-content item-input">
                                        <div class="item-inner">
                                            <div class="item-title item-label">Senha</div>
                                            <div class="item-input-wrap">
                                                <input type="password" id="senha" name="senha"
                                                    placeholder="Digite sua senha" required>
                                                <i id="viewPassword" class="ri-eye-line olho"></i>
                                            </div>
                                        </div>
                                    </li>
                                    <li class="item-content item-input">
                                        <div class="item-inner">
                                            <div class="item-title item-label">Confirmar senha</div>
                                            <div class="item-input-wrap">
                                                <input type="password" id="confirmar" name="confirmar"
                                                    placeholder="Confirme sua senha" required>
                                                <i id="viewPassword3" class="ri-eye-line olho"></i>
                                            </div>
                                        </div>
                                    </li>
                                </ul>
                            </div>

                            <div class="block">
                                <button type="submit" class="button button-fill color-blue">Cadastrar</button>
                            </div>
                        </form>

                        <div id="mensagem" class="block text-align-center color-green"></div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script type="text/javascript" src="lib/framework7-bundle.min.js"></script>
    <script type="text/javascript" src="lib/jquery-3.7.0.min.js"></script>
    <script type="text/javascript" src="js/routes.js"></script>
    <script src="cordova.js"></script>
    <script src="js/cadastro.js"></script>
    <script src="js/mascara_cadastro.js"></script>

</body>

</html>
