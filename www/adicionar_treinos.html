<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#2196f3">
    <title>Adicionar Treino</title>
    <link rel="stylesheet" href="lib/framework7-bundle.min.css">
    <link rel="stylesheet" href="css/materialdesignicons.min.css">
    <link rel="stylesheet" href="css/remixicon/remixicon.css">
</head>

<body>
    <div id="app">
        <div class="view view-main">
            <div data-name="adicionar_treino" class="page">

                <!-- Top Navbar -->
                <div class="top-nav2">
                    <h1 class="title-logo2">Adicionar Treino</h1>
                    <div class="navbar-btn">
                        <a href="/treinos_prof/" class="btn-voltar">
                            <i class="ri-arrow-left-s-line"></i>
                        </a>
                    </div>
                </div>

                <!-- Conteúdo da página -->
                <div class="page-content" style="padding-top: 0;">

                    <!-- Informações do Aluno -->
                    <div class="aluno-info">
                        <h3>Aluno: <span id="nomeAluno">Carregando...</span></h3>
                        <p style="display: none;">Email: <span id="emailAluno">Carregando...</span></p>
                    </div>

                    <div class="block">

                        <!-- Formulário de Treino -->
                        <form id="formTreino">
                            <div class="list no-hairlines">
                                <ul>
                                    <li>
                                        <h2 class="title-input">Nome do Treino</h2>
                                        <div class="item-content item-input">
                                            <div class="item-inner">
                                                <div class="item-input-wrap">
                                                    <input type="text" id="nomeTreino" name="nomeTreino"
                                                        placeholder="Ex: Treino A - Peito e Tríceps" required>
                                                </div>
                                            </div>
                                        </div>
                                    </li>

                                    <li>
                                        <h2 class="title-input">Tipo de Treino</h2>
                                        <div class="item-content item-input">
                                            <div class="item-inner">
                                                <div class="item-input-wrap">
                                                    <select id="tipoTreino" name="tipoTreino">
                                                        <option value="musculacao">Musculação</option>
                                                        <option value="cardio">Cardio</option>
                                                        <option value="funcional">Funcional</option>
                                                        <option value="esporte">Esporte Específico</option>
                                                        <option value="outro">Outro</option>
                                                    </select>
                                                </div>
                                            </div>
                                        </div>
                                    </li>

                                    <li>
                                        <h2 class="title-input">Data do Treino</h2>
                                        <div class="item-content item-input">
                                            <div class="item-inner">
                                                <div class="item-input-wrap">
                                                    <input type="date" id="dataTreino" name="dataTreino" required>
                                                </div>
                                            </div>
                                    </li>

                                    <li>
                                        <h2 class="title-input">Observações</h2>
                                        <div class="item-content item-input">
                                            <div class="item-inner">
                                                <div class="item-input-wrap">
                                                    <textarea id="observacoes" name="observacoes"
                                                        placeholder="Instruções gerais, aquecimento, etc..."></textarea>
                                                </div>
                                            </div>
                                        </div>
                                    </li>
                                </ul>
                            </div>

                            <!-- Container de Exercícios -->
                            <div class="block">
                                <h3>Exercícios</h3>
                                <div id="exerciciosContainer">
                                    <!-- Exercícios serão adicionados aqui dinamicamente -->
                                </div>

                                <button type="button" class="btn-adicionar-exercicio"
                                    onclick="window.SistemaAddTreino.utils.adicionarExercicio()">
                                    <i class="mdi mdi-plus"></i> Adicionar Exercício
                                </button>
                            </div>

                            <!-- Botão de Salvar -->
                            <div class="block">
                                <button type="submit" class="button button-fill color-blue">
                                    <i class="mdi mdi-content-save"></i>
                                    <p> Salvar Treino</p>
                                </button>
                            </div>
                        </form>

                        <div id="mensagem" class="block text-align-center"></div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script type="text/javascript" src="lib/framework7-bundle.min.js"></script>
    <script type="text/javascript" src="lib/jquery-3.7.0.min.js"></script>
    <script type="text/javascript" src="js/routes.js"></script>
    <script src="cordova.js"></script>
    <script src="js/adicionar_treino.js"></script>
</body>

</html>
