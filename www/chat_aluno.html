<!DOCTYPE html>
<html>

<head>
    <!-- Required meta tags-->
    <meta charset="utf-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <!-- Color theme for statusbar (Android only) -->
    <meta name="theme-color" content="#2196f3">
    <!-- Your app title -->
    <title>Chat com o Professor</title>
    <!-- Path to Framework7 Library Bundle CSS -->
    <link rel="stylesheet" href="lib/framework7-bundle.min.css">
    <!--Ícones Material Design-->
    <link rel="stylesheet" href="css/materialdesignicons.min.css">
    <link rel="stylesheet" href="css/chat_aluno.css">
</head>

<body>
    <!-- App root element -->
    <div id="app">
        <!-- Main view -->
        <div class="view view-main">
            <!-- Página de chat com o professor -->
            <div data-name="chat_aluno" class="page">
                <!-- Top Navbar -->
                <div class="top-nav3">
                    <h1 class="title-logo2">Chat</h1>
                    <div class="navbar-btn">
                        <a href="/link5/" class="btn-voltar">
                            <i class="ri-arrow-left-s-line"></i>
                        </a>
                    </div>
                </div>

                <!-- Conteúdo da página -->
                <div class="page-content">
                    
                        <div class="info-container">
                            <img id="profFoto" src="img/user.jpg" alt="Foto do Professor" class="prof-foto">
                            <h2 id="profNome">Nome do Professor</h2>
                            <p>Email: <span id="profEmail">email@exemplo.com</span></p>
                            <p>Escolinha: <span id="profEscolinha">Pendente</span></p>
                        </div>
                  
                </div>
            </div>
        </div>
    </div>

    <!-- Path to Framework7 Library Bundle JS-->
    <script type="text/javascript" src="lib/framework7-bundle.min.js"></script>
    <!-- jQuery -->
    <script type="text/javascript" src="lib/jquery-3.7.0.min.js"></script>
    <!-- Roteamento do app-->
    <script type="text/javascript" src="js/routes.js"></script>
    <script src="js/chat_aluno.js"></script>
    <script src="cordova.js"></script>
</body>

</html>
