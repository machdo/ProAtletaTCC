<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#f86100">
    <title>Peneiras</title>
    <link rel="stylesheet" href="lib/framework7-bundle.min.css">
    <link rel="stylesheet" href="css/materialdesignicons.min.css">
    <link rel="stylesheet" href="css/remixicon/remixicon.css">
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="css/proatleta-ui.css">
</head>

<body>
    <div id="app">
        <div class="view view-main">
            <div data-name="peneiras" class="page pa-pagina">

                <div class="pa-topo">
                    <a href="#" class="pa-icone back" aria-label="Voltar"><i class="ri-arrow-left-s-line"></i></a>
                    <h1 class="pa-topo__titulo">Peneiras</h1>
                    <button type="button" class="pa-icone" id="pnAtualizar" aria-label="Atualizar"><i class="ri-refresh-line"></i></button>
                </div>

                <div class="page-content ptr-content" data-ptr-distance="60" data-ptr-mousewheel="false">
                    <div class="ptr-preloader">
                        <div class="preloader"></div>
                        <div class="ptr-arrow"></div>
                    </div>

                    <div class="pa-conteudo">
                        <p class="pa-status" id="pnStatus" aria-live="polite"></p>

                        <label class="pa-busca pa-anima">
                            <i class="ri-search-line" aria-hidden="true"></i>
                            <input type="search" id="pnBusca" placeholder="Clube, posição ou categoria" autocomplete="off" aria-label="Buscar peneira">
                        </label>

                        <div class="pa-chips pa-anima" id="pnEsportes" aria-label="Esporte"></div>
                        <div class="pa-chips pa-anima" id="pnCidades" aria-label="Cidade"></div>

                        <section id="pnBlocoDestaques">
                            <div class="pa-secao-titulo">
                                <h2>Melhores peneiras</h2>
                            </div>
                            <div class="pa-trilho" id="pnDestaques"></div>
                        </section>

                        <section>
                            <div class="pa-secao-titulo">
                                <h2>Todas as peneiras</h2>
                                <span id="pnContagem"></span>
                            </div>
                            <div class="pa-lista" id="pnLista"></div>
                        </section>

                        <section>
                            <div class="pa-secao-titulo">
                                <h2>Notícias de peneiras</h2>
                            </div>
                            <p class="pa-status" id="pnNoticiasStatus"></p>
                            <div class="pa-lista" id="pnNoticias"></div>
                        </section>

                        <a href="/instituicao/" class="pa-convite pa-anima">
                            <i class="mdi mdi-shield-star-outline" aria-hidden="true"></i>
                            <span><strong>É escolinha ou clube?</strong>Publique sua peneira no ProAtleta</span>
                            <i class="ri-arrow-right-line" aria-hidden="true"></i>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script type="text/javascript" src="lib/framework7-bundle.min.js"></script>
    <script type="text/javascript" src="lib/jquery-3.7.0.min.js"></script>
    <script type="text/javascript" src="js/routes.js"></script>
    <script src="cordova.js"></script>
    <script src="js/peneiras.js"></script>
</body>

</html>
